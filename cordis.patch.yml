# dsh-desktop — the desktop surface: once the web server binds, launch an
# Electron window loading the DSH web GUI. The agent is driven by the web-app
# bundle's dsh-base layer; this patch only adds the Electron launcher surface.
#
# New rows go in the `insert:` list; existing rows are patched by id (the whole
# `config` is replaced, `name`/`inject` are kept).

- insert:
    - id: desktop
      name: 'dsh-desktop'
      inject: [webServer]

# DeepSeek model defaults for the desktop surface.
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
