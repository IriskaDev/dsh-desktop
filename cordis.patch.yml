# dsh-desktop — the desktop surface: launch an Electron window loading the DSH
# web GUI with no HTTP server. The agent is driven by the web-app bundle's
# dsh-base layer; this patch replaces the browser-carrier webserver with the
# desktop surface's own IPC-backed webServer service.
#
# New rows go in the `insert:` list; existing rows are patched by id.

- insert:
    - id: desktop
      name: 'dsh-desktop'
      inject: []

# The desktop surface provides a webServer-shaped service that never listens;
# disable the bundle's real node:http webserver so only that service exists.
- id: webserver
  disabled: true

# No real URL exists in the offline desktop shape; keep the web-app glue from
# printing one or injecting a loopback URL into the model/system prompt.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: false

# DeepSeek model defaults for the desktop surface.
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
